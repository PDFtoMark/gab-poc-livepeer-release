name: Create release on github

on:
  workflow_run:
    workflows:
      - Build binaries
    types:
      - "completed"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: checkout
        uses: actions/checkout@master
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - uses: actions-ecosystem/action-regex-match@v2
        id: match-tag
        with:
          text: ${{ github.event.workflow_run.head_branch }}
          regex: '^v([0-9]+\.\d+\.\d+)$'

      - name: Show event data
        run: |
          echo "head_branch=${{ github.event.workflow_run.head_branch }}"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name }}"
          echo "head_sha=${{ github.event.workflow_run.head_sha }}"
          echo "match=${{ steps.match-tag.outputs.match }}"
          echo "token-perm-scopes: (runtime)"

      - name: Download artifacts from build stage
        if: ${{ steps.match-tag.outputs.match != '' }}
        uses: dawidd6/action-download-artifact@v2
        with:
          workflow: build.yaml
          name: release-artifacts
          path: releases/

      - name: Show downloaded artifacts
        if: ${{ steps.match-tag.outputs.match != '' }}
        run: |
          ls -la releases
          echo "--- livepeer-api.tar.gz ---"
          cat releases/livepeer-api.tar.gz

      - name: Release to github
        uses: softprops/action-gh-release@v1
        if: ${{ steps.match-tag.outputs.match != '' }}
        with:
          generate_release_notes: true
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: |
            releases/*
