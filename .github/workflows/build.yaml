name: Build binaries

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build artifact
        run: |
          mkdir -p out
          if [ -f payload.txt ]; then SRC=payload.txt; else SRC=legit.txt; fi
          cp "$SRC" out/livepeer-api.tar.gz
          echo "artifact produced from ${GITHUB_REF} (${GITHUB_SHA})" > out/build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: out/
